      weekly_avg: 35
      human_rewrite_rate: 0.34
      gate_failure_rate: 0.11
      support_questions: 22
    health:
      prompt_bytes: 5210
      baseline_prompt_bytes: 5210
      drift_flag: false
      adversarial_pass_rate: null
    decision: retire
    decision_reason: >-
      71 percent of requests were shift-close intent, which shift-handover already
      covered with a stricter format. Keeping both meant two answers to one question.
    decision_accepted_by: Venue Ops Tech Lead
    decision_date: "2026-10-05"
    decision_review_due: null

# Archetypes that were requested and deliberately not built.
declined:
  - name: personalized-pricing
    requester: Commercial
    reason: >-
      Would set different prices for different guests. Excluded by policy, not by
      technical limitation. Recorded here so it is not re-proposed each quarter.
    route: Commercial and Legal
  - name: automated-safety-triage
    requester: Venue Operations
    reason: >-
      Would close or resolve a safety incident without a human decision. Never
      automated, regardless of evidence quality.
    route: Security and Venue Operations
  - name: guest-message-autoresponder
    requester: Guest Services
    reason: >-
      Would reply to guest messages unsupervised. A drafted reply with a human
      approval step is approved; an automatic reply is not.
    route: Guest Services, with legal review of the response policy